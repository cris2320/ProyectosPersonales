name: dtoo
services:
  mysql:
    image: mysql:8.4
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci --default-time-zone=+00:00
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports: ['3306:3306']
    volumes: ['./data/mysql:/var/lib/mysql']
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 10 }

  api:
    build: { context: .., dockerfile: infra/docker/php/Dockerfile }
    env_file: [../backend/.env]
    volumes: ['../backend:/var/www/html']
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }

  nginx:
    image: nginx:1.27-alpine
    ports: ['8080:80']
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../backend/public:/var/www/html/public:ro
      - ../backend/storage/app/public:/var/www/html/storage/app/public:ro
    depends_on: [api]

  queue:
    build: { context: .., dockerfile: infra/docker/php/Dockerfile }
    command: php artisan horizon
    env_file: [../backend/.env]
    volumes: ['../backend:/var/www/html']
    depends_on: [api]

  scheduler:
    build: { context: .., dockerfile: infra/docker/php/Dockerfile }
    command: php artisan schedule:work
    env_file: [../backend/.env]
    volumes: ['../backend:/var/www/html']
    depends_on: [api]

  reverb:
    build: { context: .., dockerfile: infra/docker/php/Dockerfile }
    command: php artisan reverb:start --host=0.0.0.0 --port=8085
    env_file: [../backend/.env]
    ports: ['8085:8085']
    volumes: ['../backend:/var/www/html']
    depends_on: [api]

  frontend:
    build: { context: .., dockerfile: infra/docker/node/Dockerfile }
    command: sh -c "npm ci && (npx ng serve tienda --host 0.0.0.0 --port 4200 & npx ng serve panel --host 0.0.0.0 --port 4201 & npx ng serve motorizado --host 0.0.0.0 --port 4202 & wait)"
    working_dir: /app
    volumes: ['../frontend:/app']
    ports: ['4200:4200', '4201:4201', '4202:4202']

  mailpit:
    image: axllent/mailpit
    ports: ['8025:8025', '1025:1025']
